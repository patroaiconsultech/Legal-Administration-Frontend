name: frontend-ci

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Require committed lockfile
        run: test -f package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
