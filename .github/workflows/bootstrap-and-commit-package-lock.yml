name: bootstrap-and-commit-package-lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show branch and files before generation
        shell: bash
        run: |
          set -euo pipefail
          echo "branch=${GITHUB_REF_NAME}"
          pwd
          ls -la
          test -f package.json

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile exists
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          ls -lh package-lock.json
          sha256sum package-lock.json

      - name: Clean install from generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Commit and push package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json

          if git diff --cached --quiet; then
            echo "package-lock.json already committed and up to date"
            exit 0
          fi

          git commit -m "chore(frontend): add deterministic package lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
